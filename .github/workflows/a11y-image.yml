name: Build a11y image

on:
  workflow_dispatch:
  push:
    branches:
      - nvda-a11y

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build linux-x64 package
        uses: ./.github/actions/build
        with:
          branch: nvda-a11y
          version: 5.0.0.${{ github.run_number }}
          framework: net10.0
          runtime: linux-x64
          package_tests: false

      - name: Volta
        uses: volta-cli/action@v5

      - name: Yarn install
        run: yarn install

      - name: Build frontend
        run: yarn build --env production

      - name: Add frontend to package
        run: cp -r _output/UI _artifacts/linux-x64/net10.0/Sonarr/UI

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/sonarr-a11y.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/sonarr:nvda-a11y
          build-args: |
            SONARRVERSION=5.0.0.${{ github.run_number }}
            SONARRBRANCH=nvda-a11y
